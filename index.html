<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f1">
  <meta name="description" content="Mrs Xiao — Personal Website">
  <title>Mrs Xiao</title>
  <style>
    :root{--bg:#f5f6f1;--ink:#202923;--muted:#7b867d;--accent:#78927b;--line:#e2e6de}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}
    header{height:76px;max-width:1080px;margin:auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between}
    .logo{font:24px Georgia,serif;letter-spacing:-.7px}
    .logo span{color:var(--accent)}
    nav{display:flex;gap:26px;font-size:13px;color:var(--muted)}
    a{color:var(--accent);text-decoration:none;transition:color .2s ease,background-color .2s ease,border-color .2s ease,transform .2s ease}
    a:visited{color:var(--accent)}
    a:hover{color:#526f58}
    a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
    .logo,.logo:visited{color:var(--ink)}
    .logo span{color:var(--accent)}
    nav a,nav a:visited{color:var(--accent)}
    nav a:hover{color:#526f58}
    main{min-height:calc(100vh - 140px);display:grid;place-items:center;padding:50px 24px 90px}
    .intro{text-align:center;max-width:680px}
    .eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--accent)}
    h1{font:400 clamp(62px,11vw,108px)/1.05 Georgia,"Times New Roman",serif;letter-spacing:-5px;margin:24px 0}
    h1 span{color:var(--accent);font-style:italic}
    .desc{font-size:15px;line-height:1.9;color:var(--muted);max-width:440px;margin:0 auto}
    .links{display:flex;justify-content:center;gap:12px;margin-top:34px;flex-wrap:wrap}
    .links a,.links a:visited{font-size:13px;padding:12px 20px;border:1px solid #a9bca9;border-radius:30px;color:var(--accent)}
    .links a.primary,.links a.primary:visited{background:#526f58;color:#fff;border-color:#526f58}
    .links a:hover{transform:translateY(-2px);background:#e6ece4;border-color:#526f58;color:#526f58}.links a.primary:hover{background:#405b47;border-color:#405b47;color:#fff}
    footer{max-width:1080px;margin:auto;padding:20px 28px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:#929b93;font-size:11px}
    @media(max-width:520px){header{height:68px;padding:0 20px}nav{gap:15px;font-size:12px}main{padding-bottom:65px}h1{letter-spacing:-3px}.desc{font-size:14px}footer{padding:18px 20px}}
  </style>
</head>
<body>
  <header>
    <a class="logo" href="#">Mrs <span>Xiao.</span></a>
    <nav aria-label="Main navigation">
      <a href="#home">Home</a>
      <a href="mailto:hello@mrsxiao.com">Contact</a>
    </nav>
  </header>
  <main id="home">
    <section class="intro">
      <div class="eyebrow">A personal space</div>
      <h1>Hello, I'm<br><span>Mrs Xiao.</span></h1>
      <p class="desc">Curious about the world, passionate about ideas and always learning. Welcome to my little corner of the internet.</p>
      <div class="links">
        <a class="primary" href="mailto:hello@mrsxiao.com">Get in touch ↗</a>
        <a href="https://www.mrsxiao.com">www.mrsxiao.com</a>
      </div>
    </section>
  </main>
  <footer>
    <span>© <span id="year"></span> Mrs Xiao</span>
    <span>Made with care.</span>
  </footer>
  <script>document.getElementById("year").textContent=new Date().getFullYear();</script>
</body>
</html>
